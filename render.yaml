services:
  - type: web
    name: wandertribe-java
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    branch: main
    envVars:
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: travel-intelligence
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: travel-intelligence
    env: docker
    plan: free
    dockerfilePath: ./travel-intelligence/Dockerfile
    branch: main
    envVars:
      - key: GROQ_API_KEY
        value: "PLEASE_SET_IN_RENDER_DASHBOARD"
