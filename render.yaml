services:
  - type: web
    name: wandertribe-java
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    branch: main
    envVars:
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: travel-intelligence
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: travel-intelligence
    env: python
    plan: free
    rootDir: travel-intelligence
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    branch: main
    envVars:
      - key: GROQ_API_KEY
        value: "PLEASE_SET_IN_RENDER_DASHBOARD"
      - key: PYTHON_VERSION
        value: "3.10.0"
